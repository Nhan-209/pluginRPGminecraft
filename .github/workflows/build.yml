name: Build RPGPlugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn -f RPGPlugin/pom.xml -B -s .github/maven-settings.xml package

      - name: Upload built plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: RPGPlugin-jar
          path: RPGPlugin/target/RPGPlugin-*.jar
          if-no-files-found: error
